org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true

# 强制 Gradle 守护进程使用本机 JDK 21
# 系统默认 JAVA_HOME 指向 JDK 25,AGP 8.7.3 与 jvmToolchain(21) 均不支持
# 注意:必须使用正斜杠,否则 .properties 中反斜杠会被当作转义字符吞掉
org.gradle.java.home=C:/Software-Architecture-Tools/JDK.21
